version: "3.7"

services:

  # Selected database: MySQL 5.7
  # Rationale: ACID transactions + JPA @Version (optimistic locking) are the
  # cleanest fit for the balance-debit atomicity requirement.
  # See README.md for the full MySQL vs MongoDB decision analysis.
  mysql:
    image: mysql:5.7
    hostname: mysql
    container_name: mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: miniautorizador
      MYSQL_ROOT_PASSWORD:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    # Healthcheck ensures MySQL is actually ready to accept connections
    # before dependent services (or the app) attempt to connect.
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "--silent" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # MongoDB is available as an alternative but was not selected.
  # Uncomment below if you wish to switch to MongoDB.
  #
  # mongo:
  #   image: mongo:4.2
  #   hostname: mongo
  #   container_name: mongo
  #   ports:
  #     - 27017:27017
  #   environment:
  #     MONGO_INITDB_DATABASE: miniautorizador
  #     MONGO_INITDB_ROOT_USERNAME: user
  #     MONGO_INITDB_ROOT_PASSWORD: password
  #   volumes:
  #     - ./scripts/init.js:/docker-entrypoint-initdb.d/init.js:ro
